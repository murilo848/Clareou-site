name: Gerar imagens

# Roda quando chega um artigo novo em posts/ ou quando você aperta "Run workflow".
on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-imagens
  cancel-in-progress: false

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar imagens que faltam
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/gerar-imagens.js
      - name: Conferir o site
        if: always()
        run: node build.js
      - name: Salvar imagens no repositório
        if: always()
        run: |
          git config user.name "clareou-imagens"
          git config user.email "actions@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then echo "Nenhuma imagem nova."; exit 0; fi
          git commit -m "Imagens geradas automaticamente"
          git pull --rebase origin main
          git push origin main
